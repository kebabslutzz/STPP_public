spring.application.name=movies
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Use a connection pool for better performance
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
# Set Hibernate DDL to none to prevent schema changes in production
spring.jpa.hibernate.ddl-auto=none
# Disable SQL logging
spring.jpa.show-sql=false
# Use the appropriate dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Liquibase settings
spring.liquibase.change-log=classpath:db/changelog-master.xml
logging.level.liquibase=WARN
spring.liquibase.contexts=production
# Adjust logging levels for production
logging.level.org.springframework.jdbc=ERROR
logging.level.org.springframework.data=ERROR
logging.level.org.springframework.orm=ERROR
logging.level.org.springframework.hibernate=ERROR
logging.level.org.springframework.web=INFO
#
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
#
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
